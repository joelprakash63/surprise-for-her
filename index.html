<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Important Message</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            overflow-x: hidden;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fce7f3 0%, #fff1f2 50%, #fce7f3 100%);
            padding: 1rem;
            position: relative;
            overflow: hidden;
        }

        .hearts-background {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            color: #fbcfe8;
            opacity: 0.3;
            animation: float 8s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(5deg); }
            50% { transform: translateY(-40px) rotate(-5deg); }
            75% { transform: translateY(-20px) rotate(3deg); }
        }

        .content {
            text-align: center;
            z-index: 10;
        }

        .main-heart {
            width: 96px;
            height: 96px;
            margin: 0 auto 1.5rem;
            color: #f43f5e;
            animation: bounceSlow 2s ease-in-out infinite;
        }

        @keyframes bounceSlow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        h1 {
            font-size: 3rem;
            font-weight: bold;
            color: #e11d48;
            font-family: 'Brush Script MT', cursive;
            margin-bottom: 2rem;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
            justify-content: center;
        }

        @media (min-width: 640px) { .buttons { flex-direction: row; } }

        button {
            font-size: 1.5rem;
            font-weight: bold;
            padding: 1.5rem 3rem;
            border-radius: 9999px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .yes-button { background-color: #f43f5e; color: white; }
        .no-button { background-color: white; color: #e11d48; border: 2px solid #fda4af; }
        .no-button.moved { position: fixed; transition: all 0.2s ease-out; }

        .success-card {
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 1.5rem;
            padding: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            margin: 2rem 0;
        }

        .success-image { width: 100%; max-width: 400px; border-radius: 1rem; }

        footer {
            position: absolute;
            bottom: 1rem;
            text-align: center;
            width: 100%;
            color: #fb7185;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hearts-background" id="hearts"></div>
        <div class="content" id="content">
            <svg class="main-heart" fill="currentColor" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            <h1>Important Message</h1>
            <div class="buttons">
                <button class="yes-button" onclick="handleYes()">Yes! 💖</button>
                <button class="no-button" id="noButton" onmouseenter="moveButton()">No 😢</button>
            </div>
        </div>
        <footer>Made with love ❤️</footer>
    </div>

    <script>
        function moveButton() {
            const btn = document.getElementById('noButton');
            btn.classList.add('moved');
            btn.style.left = Math.random() * (window.innerWidth - btn.offsetWidth) + 'px';
            btn.style.top = Math.random() * (window.innerHeight - btn.offsetHeight) + 'px';
        }

        function handleYes() {
            document.getElementById('content').innerHTML = `
                <div class="success-container">
                    <h1 style="font-family: 'Brush Script MT', cursive;">Good choice ❤️</h1>
                    <div class="success-card">
                        <img src="https://i.ibb.co/Lzf787M/image-3b195e.png" class="success-image">
                    </div>
                    <p style="font-size: 1.8rem; color: #be123c;">I knew you'd say yes! 💕</p>
                </div>`;
        }

        const hearts = document.getElementById('hearts');
        for (let i = 0; i < 15; i++) {
            const h = document.createElement('div');
            h.innerHTML = '❤️';
            h.style.position = 'absolute';
            h.style.left = Math.random() * 100 + '%';
            h.style.top = Math.random() * 100 + '%';
            h.style.opacity = '0.3';
            h.style.fontSize = Math.random() * 20 + 10 + 'px';
            hearts.appendChild(h);
        }
    </script>
</body>
</html>
