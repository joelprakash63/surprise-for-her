<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Important Message</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            overflow-x: hidden;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fce7f3 0%, #fff1f2 50%, #fce7f3 100%);
            padding: 1rem;
            position: relative;
            overflow: hidden;
        }

        .hearts-background {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            color: #fbcfe8;
            opacity: 0.3;
            animation: float 8s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            25% {
                transform: translateY(-20px) rotate(5deg);
            }
            50% {
                transform: translateY(-40px) rotate(-5deg);
            }
            75% {
                transform: translateY(-20px) rotate(3deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounceSlow {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        .content {
            text-align: center;
            z-index: 10;
            animation: fadeIn 0.8s ease-out;
        }

        .main-heart {
            width: 96px;
            height: 96px;
            margin: 0 auto 1.5rem;
            color: #f43f5e;
            animation: bounceSlow 2s ease-in-out infinite;
        }

        .success-heart {
            width: 80px;
            height: 80px;
            margin: 0 auto 1rem;
            color: #f43f5e;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        h1 {
            font-size: 3rem;
            font-weight: bold;
            color: #e11d48;
            font-family: 'Brush Script MT', 'Lucida Handwriting', 'Apple Chancery', cursive, system-ui;
            line-height: 1.2;
            margin-bottom: 2rem;
            padding: 0 1rem;
        }

        .small-hearts {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 3rem;
        }

        .small-heart {
            color: #f9a8d4;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
            justify-content: center;
            padding: 0 1rem;
        }

        @media (min-width: 640px) {
            .buttons {
                flex-direction: row;
            }
        }

        button {
            font-size: 1.5rem;
            font-weight: bold;
            padding: 2rem 3rem;
            border-radius: 9999px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .yes-button {
            background-color: #f43f5e;
            color: white;
        }

        .yes-button:hover {
            background-color: #e11d48;
            transform: scale(1.1);
            box-shadow: 0 20px 25px -5px rgba(244, 63, 94, 0.3);
        }

        .no-button {
            background-color: rgba(255, 255, 255, 0.8);
            color: #e11d48;
            border: 2px solid #fda4af;
        }

        .no-button:hover {
            background-color: white;
        }

        .no-button.moved {
            position: fixed;
            transition: all 0.3s ease-out;
        }

        .tagline {
            font-size: 1.25rem;
            color: #f43f5e;
            font-weight: 500;
            font-style: italic;
            margin-top: 2rem;
            padding: 0 1rem;
        }

        .success-container {
            max-width: 28rem;
            margin: 0 auto;
        }

        .success-card {
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            border-radius: 1.5rem;
            padding: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            margin: 2rem 0;
        }

        .success-image {
            width: 100%;
            height: auto;
            border-radius: 1rem;
        }

        .success-text {
            font-size: 1.5rem;
            color: #be123c;
            font-weight: 500;
            margin-top: 2rem;
        }

        footer {
            position: absolute;
            bottom: 1rem;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 10;
        }

        footer p {
            color: #fb7185;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
        }

        @media (min-width: 768px) {
            h1 {
                font-size: 4.5rem;
            }
            button {
                font-size: 1.875rem;
            }
            .tagline {
                font-size: 1.5rem;
            }
            .success-text {
                font-size: 1.875rem;
            }
        }

        @media (min-width: 1024px) {
            h1 {
                font-size: 6rem;
            }
        }
    </style>
</head>
<body>
    <div id="app" class="container">
        <div class="hearts-background" id="hearts"></div>

        <div class="content" id="content">
            <svg class="main-heart" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
            
            <h1>Important Message</h1>
            
            <div class="small-hearts">
                <svg class="small-heart" width="24" height="24" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
                <svg class="small-heart" width="32" height="32" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
                <svg class="small-heart" width="24" height="24" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
            </div>

            <div class="buttons">
                <button class="yes-button" onclick="handleYes()">Yes! 💖</button>
                <button class="no-button" id="noButton" onmouseenter="handleNoHover()" ontouchstart="handleNoHover()">No 😢</button>
            </div>

            <p class="tagline">Choose wisely... 💕</p>
        </div>

        <footer>
            <p>Made with love ❤️</p>
        </footer>
    </div>

    <script>
        function generateHearts() {
            const heartsContainer = document.getElementById('hearts');
            const heartCount = 15;
            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                heart.classList.add('heart');
                heart.setAttribute('fill', 'currentColor');
                heart.setAttribute('viewBox', '0 0 24 24');
                heart.style.left = Math.random() * 100 + '%';
                heart.style.top = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 5 + 's';
                heart.style.animationDuration = (5 + Math.random() * 5) + 's';
                heart.style.width = (20 + Math.random() * 30) + 'px';
                heart.style.height = (20 + Math.random() * 30) + 'px';
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', 'M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z');
                heart.appendChild(path);
                heartsContainer.appendChild(heart);
            }
        }

        function handleNoHover() {
            const noButton = document.getElementById('noButton');
            const maxX = window.innerWidth - 200;
            const maxY = window.innerHeight - 100;
            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;
            noButton.classList.add('moved');
            noButton.style.left = randomX + 'px';
            noButton.style.top = randomY + 'px';
        }

        function handleYes() {
            const heartsContainer = document.getElementById('hearts');
            heartsContainer.innerHTML = '';
            for (let i = 0; i < 20; i++) {
                const heart = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                heart.classList.add('heart');
                heart.setAttribute('fill', 'currentColor');
                heart.setAttribute('viewBox', '0 0 24 24');
                heart.style.left = Math.random() * 100 + '%';
                heart.style.top = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 5 + 's';
                heart.style.animationDuration = (5 + Math.random() * 5) + 's';
                heart.style.width = (20 + Math.random() * 30) + 'px';
                heart.style.height = (20 + Math.random() * 30) + 'px';
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', 'M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z');
                heart.appendChild(path);
                heartsContainer.appendChild(heart);
            }

            document.getElementById('content').innerHTML = `
                <div class="success-container">
                    <svg class="success-heart" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                    <h1>Good choice ❤️</h1>
                    <div class="success-card">
                        <img src="https://pin.it/396yRl0Iq" alt="Good choice celebration" class="success-image" />
                    </div>
                    <p class="success-text">Will you be my Valentine? 💕</p>
                </div>
            `;
        }

        generateHearts();
    </script>
</body>
</html>
